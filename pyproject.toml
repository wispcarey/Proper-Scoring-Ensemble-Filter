[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proper-scoring-ensemble-filter"
version = "0.1.0"
description = "Code for Learning Probabilistic Filters with Strictly Proper Scoring Rules"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Bohan Chen" }
]

[tool.setuptools.packages.find]
include = ["psef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
